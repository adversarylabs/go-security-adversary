name: go/security
version: 0.0.13
description: Reviews Go trust boundaries, authentication, cryptography, transport security, and secret handling.

triggers:
  manual: true
  files_changed:
    - "**/*.go"

detection:
  files:
    - "**/*.go"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  model: true
  environment:
    allow: []

findings:
  format: adversary.review.v1
